# RetroArch for TelecommanderOS -- NES on a Saba CRT via the Pi's DRM output.
#
# There is no X and no desktop here: RetroArch renders straight to KMS/DRM,
# the same surface mpv uses, which is why tvplayer must be stopped before a
# game starts (one DRM master at a time).
#
# Controls come from the 8BitDo keyboard, which retrokb ungrabs for the
# duration of a game. Its joystick emits ordinary arrow keys and its ABXY pad
# emits a/b/x/z, so mapping those key NAMES serves both the add-on pad and
# the keyboard's own letter keys.

video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
# match tvplayer's pinned mode exactly (the Saba offers 32, including 1080i
# variants it cannot really show) -- same surface, same negotiation, no
# mode-switch flicker when handing the display back and forth
video_fullscreen_x = "1280"
video_fullscreen_y = "720"
video_monitor_index = "1"
video_vsync = "true"
video_smooth = "false"          # sharp pixels; the CRT does the softening
video_scale_integer = "false"
# The output is a 1280x720 signal that the Saba squeezes onto a 4:3 tube.
# So the 4:3 game must FILL the 16:9 frame and let the tube do the aspect
# correction -- letting RetroArch pillarbox it "correctly" for 16:9 makes it
# narrow on the actual screen. Exactly the --monitoraspect=4:3 trick mpv uses.
video_aspect_ratio_auto = "false"
aspect_ratio_index = "1"

audio_driver = "alsa"
audio_device = "plughw:CARD=vc4hdmi,DEV=0"
audio_enable = "true"

menu_driver = "rgui"
video_shader_enable = "false"            # lightweight, works without assets
video_font_enable = "true"

# --- player 1: the 8BitDo keyboard ---------------------------------------
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "a"
input_player1_b = "b"
input_player1_x = "x"
input_player1_y = "z"
input_player1_start = "enter"
input_player1_select = "space"

# ESC would collide with the numpad's C key (same scancode), and quitting is
# retrokb's job -- it kills the process when C is pressed on the numpad.
input_exit_emulator = "nul"
input_menu_toggle = "f1"

# Sensible defaults for a couch: no rewind (costs RAM), autosave on.
rewind_enable = "false"
savestate_auto_save = "true"
savestate_auto_load = "true"
config_save_on_exit = "false"
